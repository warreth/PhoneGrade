name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build AutoDymoLabelApp/AutoDymoLabelApp.sln -c Release

      - name: Run tests (xUnit + headless Avalonia)
        run: dotnet test AutoDymoLabelApp/Tests/Tests.csproj -c Release --no-build

      # Smoke test the release packaging path on each OS: publish + vpk pack.
      # Catches bundle/tool breakage before a tag is cut.
      - name: Packaging smoke test (vpk)
        shell: bash
        run: |
          set -e
          dotnet tool install --global vpk --version 1.2.0 || dotnet tool update --global vpk --version 1.2.0
          # .NET bootstrap is Windows-only (Velopack docs); mac/linux go
          # self-contained and skip --framework.
          case "$RUNNER_OS" in
            Windows) RID=win-x64;   SC=false; ICON=AutoDymoLabelApp/AutoDymoLabelApp.UI/Assets/avalonia-logo.ico; MAIN=AutoDymoLabelApp.UI.exe; EXTRA=(--framework net8.0-x64-desktop) ;;
            macOS)   RID=osx-arm64; SC=true;  ICON=AutoDymoLabelApp/AutoDymoLabelApp.UI/Assets/app-icon.icns;    MAIN=AutoDymoLabelApp.UI;    EXTRA=() ;;
            Linux)   RID=linux-x64; SC=true;  ICON=AutoDymoLabelApp/AutoDymoLabelApp.UI/Assets/app-icon.png;      MAIN=AutoDymoLabelApp.UI;    EXTRA=() ;;
          esac
          dotnet publish AutoDymoLabelApp/AutoDymoLabelApp.UI/AutoDymoLabelApp.UI.csproj \
            -c Release -r "$RID" --self-contained "$SC" -o pkg-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p pkg-smoke/idevice-tools
            curl -sL "https://github.com/L1ghtmann/libimobiledevice/releases/latest/download/libimobile-suite-latest_x86_64-mingw64.tar.xz" -o suite.tar.xz
            tar -xJf suite.tar.xz -C pkg-smoke/idevice-tools --strip-components=1
            test -f pkg-smoke/idevice-tools/idevice_id.exe
          fi
          vpk pack --packId SmokeTest --packVersion 0.0.1 --packDir pkg-smoke \
            --mainExe "$MAIN" --channel ci --outputDir releases-smoke \
            --delta None --icon "$ICON" "${EXTRA[@]}"
          ls releases-smoke

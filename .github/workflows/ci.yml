name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      # Every system finishes even when one of them fails. Fail-fast is on by
      # default, so one red test step cancelled the other two and a run only
      # ever named the first system to break, which costs a push per system to
      # find out what the others were doing.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A normal run is well under ten minutes per system; the default six hour
    # cap would let a hung test host sit red for the rest of the day.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build PhoneGradeApp/PhoneGrade.sln -c Release

      - name: Run tests (xUnit + headless Avalonia)
        shell: bash
        run: |
          set -o pipefail
          dotnet test PhoneGradeApp/Tests/Tests.csproj -c Release --no-build 2>&1 | tee "$RUNNER_TEMP/tests.out"
        env:
          # Live imei.info facts read this; without the secret they skip.
          IMEI_INFO_API_KEY: ${{ secrets.IMEI_INFO_API_KEY }}
          # The live download-URL fact queries api.github.com; authenticated
          # requests are not rate-limited from a shared runner address.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A job log can only be downloaded by someone with admin rights on the
      # repository, so a red test step is invisible from the outside: nobody
      # can tell which tests broke. The run summary and the annotations on a
      # check run are both readable without a token, so the failures are
      # repeated there. One annotation carries the lot, because GitHub only
      # keeps a handful per step.
      - name: Report the tests that failed
        if: failure()
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/tests.out" ]; then
            echo "::error::the test step produced no output at all"
            exit 0
          fi
          awk '
            /^[ \t]*Failed / {
              line = $0
              sub(/^[ \t]+/, "", line)
              sub(/ \[[0-9.]+ ms\].*$/, "", line)
              names = names (names == "" ? "" : "; ") line
              next
            }
            /Error Message:/ { em = 1; next }
            em {
              if ($0 ~ /Stack Trace:/) { em = 0; next }
              text = $0
              sub(/^[ \t]+/, "", text)
              if (text != "") msgs = msgs (msgs == "" ? "" : " | ") text
            }
            END { print names; print msgs }
          ' "$RUNNER_TEMP/tests.out" > "$RUNNER_TEMP/failures.txt"
          {
            echo "## Tests that failed"
            echo
            echo '```'
            cat "$RUNNER_TEMP/failures.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          first=$(head -1 "$RUNNER_TEMP/failures.txt")
          detail=$(tail -n +2 "$RUNNER_TEMP/failures.txt")
          if [ -z "$first" ]; then
            echo "::error::tests failed, but no failing test name could be read out of the output"
          else
            echo "::error::$first${detail:+ :: $detail}"
          fi

      # The PWA modules have their own suite under wwwroot/tests. Nothing else
      # ran it, so it silently rotted whenever a module changed.
      - name: Run PWA module tests (node)
        shell: bash
        run: node --test "PhoneGradeApp/PhoneGrade.UI/wwwroot/tests/*.test.js"

      # Smoke test the release packaging path on each OS: publish + vpk pack.
      # Catches bundle/tool breakage before a tag is cut.
      - name: Packaging smoke test (vpk)
        shell: bash
        run: |
          set -e
          # ~/.dotnet/tools is on PATH on GitHub runners but not everywhere
          # (e.g. local runs with nektos/act); export it so vpk always resolves.
          export PATH="$PATH:$HOME/.dotnet/tools"
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -qq && sudo apt-get install -y -qq squashfs-tools; fi
          dotnet tool install --global vpk --version 1.2.0 || dotnet tool update --global vpk --version 1.2.0
          # .NET bootstrap is Windows-only (Velopack docs); mac/linux go
          # self-contained and skip --framework.
          case "$RUNNER_OS" in
            Windows) RID=win-x64;   SC=false; ICON=PhoneGradeApp/PhoneGrade.UI/Assets/avalonia-logo.ico; MAIN=PhoneGrade.UI.exe; EXTRA=(--framework net8.0-x64-desktop) ;;
            macOS)   RID=osx-arm64; SC=true;  ICON=PhoneGradeApp/PhoneGrade.UI/Assets/app-icon.icns;    MAIN=PhoneGrade.UI;    EXTRA=() ;;
            Linux)   RID=linux-x64; SC=true;  ICON=PhoneGradeApp/PhoneGrade.UI/Assets/app-icon.png;      MAIN=PhoneGrade.UI;    EXTRA=() ;;
          esac
          dotnet publish PhoneGradeApp/PhoneGrade.UI/PhoneGrade.UI.csproj \
            -c Release -r "$RID" --self-contained "$SC" -o pkg-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then
            mkdir -p pkg-smoke/idevice-tools
            curl -sL "https://github.com/L1ghtmann/libimobiledevice/releases/latest/download/libimobile-suite-latest_x86_64-mingw64.tar.xz" -o suite.tar.xz
            tar -xJf suite.tar.xz -C pkg-smoke/idevice-tools --strip-components=1
            test -f pkg-smoke/idevice-tools/idevice_id.exe
          fi
          vpk pack --packId SmokeTest --packVersion 0.0.1 --packDir pkg-smoke \
            --mainExe "$MAIN" --channel ci --outputDir releases-smoke \
            --delta None --icon "$ICON" "${EXTRA[@]}"
          ls releases-smoke

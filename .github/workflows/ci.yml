name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build AutoDymoLabelApp/AutoDymoLabelApp.sln -c Release

      - name: Run self-check tests
        run: dotnet run --project AutoDymoLabelApp/Tests -c Release --no-build
